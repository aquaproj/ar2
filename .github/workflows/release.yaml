---
name: Release
on:
  push:
    tags: [v*]
permissions: {}
jobs:
  release:
    uses: suzuki-shunsuke/go-release-workflow/.github/workflows/release.yaml@d2023d26bcd8b66860fb48b0a834a2cdc1cc926d # feat/split-build
    with:
      go-version-file: go.mod
      aqua_version: v2.64.0
      split_build: true
    secrets:
      TAKUMI_GUARD_BOT_ID: ${{secrets.TAKUMI_GUARD_BOT_ID}}
    permissions:
      contents: write
      id-token: write
      actions: read
      attestations: write
