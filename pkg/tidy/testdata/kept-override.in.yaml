type: github_release
repo_owner: pnpm
repo_name: pnpm
description: pnpm
files:
  - name: pnpm
overrides:
  # The musl build's name doesn't say musl, so nothing but this says which build it is.
  - goos: linux
    asset: pnpm-alpine-{{.Arch}}.{{.Format}}
    variants:
      - key: libc
        value: musl
  # A later sibling the same environment could match, so this one is the first match.
  - goos: windows
  - goos: windows
    format: zip
